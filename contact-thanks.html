  <script>
    NAZONE.init({ crumb: "送信完了" });
    const body = document.getElementById("thanks-body");
    const lines = CONTACT.thanksMessage || [];
    body.innerHTML = lines

      .map((line) => `<p>${line}</p>`)
      .join("");
