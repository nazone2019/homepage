<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONEのグッズ一覧">
  <title>GOODS | NAZONE</title>
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="section-head">
      <p>Goods</p>
      <h1>グッズ</h1>
    </div>
    <p class="page-lead">NAZONEのグッズ・キット一覧です。</p>
    <p class="filter-label">年</p>
    <div class="filters" id="filters" role="tablist" aria-label="年で絞り込み"></div>
    <div class="work-grid" id="goods-grid"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/goods.js"></script>
  <script src="js/main.js"></script>
  <script>
    NAZONE.init({ crumb: "GOODS" });

    const goods = getListedGoods();
    const years = getGoodYears();
    const filters = document.getElementById("filters");
    const grid = document.getElementById("goods-grid");

    filters.innerHTML =
      `<button type="button" class="filter-btn is-active" data-year="all">すべて</button>` +
      years.map((y) => `<button type="button" class="filter-btn" data-year="${y}">${y}</button>`).join("");

    grid.innerHTML = goods.map((g) => NAZONE.goodCardHtml(g, "h2")).join("");
    filters.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      filters.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      const year = btn.dataset.year;
      grid.querySelectorAll(".work-card").forEach((card) => {
        const show = year === "all" || card.dataset.year === year;
        card.classList.toggle("is-hidden", !show);
      });
    });
  </script>
</body>
</html>
