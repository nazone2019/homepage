<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全国の大学生を中心とした謎解き制作集団 NAZONE">
  <meta property="og:title" content="NAZONE">
  <meta property="og:description" content="全国の大学生を中心とした謎解き制作集団">
  <meta property="og:image" content="assets/brand/og.jpg">
  <title>NAZONE</title>
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="wrap">
    <section class="hero" aria-label="メインビジュアル">
      <img src="assets/brand/colorbar.webp" alt="ココロざす を 志す NAZONE">
      <div class="hero__bar">
        <p id="home-lead"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" href="about.html">ABOUT</a>
          <a class="btn btn--ghost" href="contents.html">WORKS</a>
          <a class="btn btn--ghost" href="goods.html">GOODS</a>
        </div>
      </div>
      <div class="colorbar" aria-hidden="true"></div>
    </section>

    <section id="about" aria-labelledby="home-about-heading">
      <div class="section-head">
        <p>About</p>
        <h2 id="home-about-heading">NAZONEとは</h2>
      </div>
      <p class="about-copy" id="home-about-text"></p>
      <a class="more-link" href="about.html">詳しく見る</a>
    </section>

    <section id="works" aria-labelledby="home-works-heading">
      <div class="section-head">
        <p>Works</p>
        <h2 id="home-works-heading">制作したもの</h2>
      </div>
      <div class="work-grid" id="home-works"></div>
      <p style="margin-top:16px;">
        <a class="more-link" href="contents.html">すべて表示</a>
      </p>
    </section>

    <section id="goods" aria-labelledby="home-goods-heading">
      <div class="section-head">
        <p>Goods</p>
        <h2 id="home-goods-heading">グッズ</h2>
      </div>
      <div class="work-grid" id="home-goods"></div>
      <p style="margin-top:16px;">
        <a class="more-link" href="goods.html">すべて表示</a>
      </p>
    </section>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/about.js"></script>
  <script src="data/works.js"></script>
  <script src="data/goods.js"></script>
  <script src="js/main.js"></script>
  <script>
    NAZONE.init();
    (function () {
      const lead = document.getElementById("home-lead");
      if (lead) lead.textContent = SITE.description;
      const aboutText = document.getElementById("home-about-text");
      if (aboutText) aboutText.textContent = ABOUT.lead;

      const homeWorks = document.getElementById("home-works");
      if (homeWorks) {
        homeWorks.innerHTML = getListedWorks().slice(0, 6).map((w) => NAZONE.workCardHtml(w)).join("");
      }
      const homeGoods = document.getElementById("home-goods");
      if (homeGoods) {
        homeGoods.innerHTML = getListedGoods().map((g) => NAZONE.goodCardHtml(g)).join("");
      }
    })();
  </script>
</body>
</html>
