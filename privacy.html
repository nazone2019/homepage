<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONE プライバシーポリシー">
  <title>PRIVACY POLICY | NAZONE</title>
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="section-head">
      <p>Privacy</p>
      <h1>プライバシーポリシー</h1>
    </div>
    <div id="privacy-content"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/privacy.js"></script>
  <script src="js/main.js"></script>
  <script>
    NAZONE.init({ crumb: "PRIVACY" });
    const p = PRIVACY;
    document.getElementById("privacy-content").innerHTML = `
      <p class="page-lead">${p.intro}</p>
      ${p.sections
        .map(
          (s) => `
        <section class="privacy-block">
          <h2>${s.title}</h2>
          <p>${s.body}</p>
        </section>`
        )
        .join("")}
      <p style="margin-top:24px;font-size:13px;">
        お問い合わせは<a class="more-link" href="contact.html">こちら</a>
      </p>
    `;
  </script>
</body>
</html>
