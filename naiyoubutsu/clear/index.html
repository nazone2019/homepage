  <script>
    (function () {
      var imagePath = "../../assets/naiyoubutsu/clear.png";
      var absolute = new URL(imagePath, window.location.href).href;
      ["og:image", "twitter:image"].forEach(function (name) {
        var prop = name.indexOf("twitter:") === 0 ? "name" : "property";
        var el = document.querySelector('meta[' + prop + '="' + name + '"]');
        if (el) el.setAttribute("content", absolute);
      });
      var canonical = document.createElement("meta");
      canonical.setAttribute("property", "og:url");
      canonical.setAttribute("content", window.location.href.split("#")[0]);
      document.head.appendChild(canonical);
    })();
  </script>
