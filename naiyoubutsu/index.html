<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONE">
  <title>NAZONE</title>
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="section-head" id="naiyoubutsu-head" hidden>
      <h1 id="naiyoubutsu-title"></h1>
    </div>
    <p class="page-lead" id="naiyoubutsu-lead" hidden></p>
    <div id="naiyoubutsu-content"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../data/site.js"></script>
  <script src="../data/naiyoubutsu.js"></script>
  <script src="../js/main.js"></script>
  <script>
    NAZONE.init();
    const data = NAIYOUBUTSU;
    if (data.title) {
      document.title = `${data.title} | NAZONE`;
      document.getElementById("naiyoubutsu-title").textContent = data.title;
      document.getElementById("naiyoubutsu-head").hidden = false;
    }
    if (data.lead) {
      document.getElementById("naiyoubutsu-lead").textContent = data.lead;
      document.getElementById("naiyoubutsu-lead").hidden = false;
    }
    const mount = document.getElementById("naiyoubutsu-content");
    if (data.sections && data.sections.length) {
      mount.innerHTML = data.sections
        .map(
          (s) => `
        <section class="about-block">
          ${s.title ? `<h2>${s.title}</h2>` : ""}
          ${s.body ? `<p>${s.body}</p>` : ""}
        </section>`
        )
        .join("");
    }
  </script>
</body>
</html>
