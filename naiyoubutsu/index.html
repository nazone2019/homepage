<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONE 解答入力">
  <title>はじめに | NAZONE</title>
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="page-naiyoubutsu">
  <p class="naiyou-hero">
    <img src="title.png" alt="まずは内容物一覧をご確認ください！">
  </p>

  <main class="wrap naiyou-wrap">
    <section class="naiyou-intro" aria-labelledby="naiyou-title">
      <h1 id="naiyou-title"></h1>
      <p class="naiyou-thanks" id="naiyou-thanks"></p>
      <section class="naiyou-block" aria-labelledby="contents-title">
        <h2 id="contents-title"></h2>
        <ul id="naiyou-contents"></ul>
      </section>
      <section class="naiyou-block" aria-labelledby="notes-title">
        <h2 id="notes-title"></h2>
        <ul id="naiyou-notes"></ul>
      </section>
      <button class="naiyou-btn" id="start-btn" type="button"></button>
    </section>
    <div id="naiyou-steps"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../data/site.js"></script>
  <script src="../data/naiyoubutsu.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      const data = NAIYOUBUTSU;
      const STORAGE_KEY = "naiyoubutsu-progress";

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function normalize(value) {
        return String(value)
          .normalize("NFKC")
          .replace(/\s+/g, "")
          .toLowerCase();
      }

      function loadProgress() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY);
          if (!raw) return { started: false, solved: 0 };
          const parsed = JSON.parse(raw);
          return {
            started: Boolean(parsed.started),
            solved: Math.max(0, Math.min(data.steps.length, Number(parsed.solved) || 0)),
          };
        } catch (err) {
          return { started: false, solved: 0 };
        }
      }

      function saveProgress(progress) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      }

      function isCorrect(step, value) {
        const answers = (step.answers || []).map(normalize).filter(Boolean);
        if (!answers.length) return false;
        return answers.includes(normalize(value));
      }

      function stepHtml(step, index, state) {
        const n = index + 1;
        if (state === "done") {
          return `
            <section class="naiyou-step" data-step="${n}">
              <p class="naiyou-open">${escapeHtml(step.open)}</p>
              <p class="naiyou-q">${escapeHtml(step.question)}</p>
              <p class="naiyou-ok">${escapeHtml(data.correctMessage)}</p>
            </section>`;
        }
        return `
          <section class="naiyou-step" data-step="${n}">
            <p class="naiyou-open">${escapeHtml(step.open)}</p>
            <p class="naiyou-q">${escapeHtml(step.question)}</p>
            <form class="naiyou-form" data-index="${index}">
              <label class="visually-hidden" for="answer-${n}">答え</label>
              <input id="answer-${n}" name="answer" type="text" autocomplete="off" inputmode="text">
              <button class="naiyou-btn" type="submit">送信</button>
              <p class="naiyou-ng" hidden>${escapeHtml(data.wrongMessage)}</p>
            </form>
          </section>`;
      }

      function renderSteps(solved, currentOpen) {
        const mount = document.getElementById("naiyou-steps");
        const parts = [];
        for (let i = 0; i < solved; i += 1) {
          parts.push(stepHtml(data.steps[i], i, "done"));
        }
        if (currentOpen && solved < data.steps.length) {
          parts.push(stepHtml(data.steps[solved], solved, "open"));
        }
        mount.innerHTML = parts.join("");
        const nextInput = mount.querySelector("input");
        if (nextInput) nextInput.focus();
      }

      NAZONE.init();

      document.getElementById("naiyou-title").textContent = data.title || "はじめに";
      document.getElementById("naiyou-thanks").textContent = data.thanks || "";
      document.getElementById("contents-title").textContent = data.contentsTitle || "内容物";
      document.getElementById("notes-title").textContent = data.notesTitle || "注意事項";
      document.getElementById("naiyou-contents").innerHTML = (data.contents || [])
        .map((line) => `<li>${escapeHtml(line)}</li>`)
        .join("");
      document.getElementById("naiyou-notes").innerHTML = (data.notes || [])
        .map((line) => `<li>${escapeHtml(line)}</li>`)
        .join("");

      const startBtn = document.getElementById("start-btn");
      startBtn.textContent = data.startLabel || "始める";

      const progress = loadProgress();

      function begin() {
        progress.started = true;
        saveProgress(progress);
        startBtn.classList.add("is-hidden");
        renderSteps(progress.solved, true);
      }

      if (progress.started) {
        begin();
      }

      startBtn.addEventListener("click", () => {
        if (progress.started) return;
        begin();
      });

      document.getElementById("naiyou-steps").addEventListener("submit", (e) => {
        const form = e.target.closest(".naiyou-form");
        if (!form) return;
        e.preventDefault();
        const index = Number(form.dataset.index);
        if (index !== progress.solved) return;
        const input = form.querySelector("input");
        const ng = form.querySelector(".naiyou-ng");
        const value = (input && input.value) || "";
        if (isCorrect(data.steps[index], value)) {
          progress.solved += 1;
          saveProgress(progress);
          renderSteps(progress.solved, progress.solved < data.steps.length);
        } else if (ng) {
          ng.hidden = false;
        }
      });

      document.getElementById("naiyou-steps").addEventListener("input", (e) => {
        const form = e.target.closest(".naiyou-form");
        if (!form) return;
        const ng = form.querySelector(".naiyou-ng");
        if (ng) ng.hidden = true;
      });
    })();
  </script>
</body>
</html>
