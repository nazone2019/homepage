<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONE 解答入力">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>はじめに | NAZONE</title>
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="page-naiyoubutsu">
  <div class="naiyou-sheet">
    <p class="naiyou-hero">
      <img src="../assets/naiyoubutsu/title.png" alt="まずは内容物一覧をご確認ください！" width="2504" height="1772">
    </p>

    <main class="naiyou-wrap">
    <section class="naiyou-intro" aria-labelledby="naiyou-title">
      <h1 id="naiyou-title" class="visually-hidden">はじめに</h1>
      <p class="naiyou-start-image">
        <img id="naiyou-start-img" src="../assets/naiyoubutsu/start.png" alt="はじめに" width="1200" height="630">
      </p>
      <div class="naiyou-thanks" id="naiyou-thanks"></div>
      <section class="naiyou-notes-box" aria-labelledby="notes-title">
        <h2 id="notes-title"></h2>
        <ul id="naiyou-notes"></ul>
      </section>
      <button class="naiyou-btn" id="start-btn" type="button"></button>
    </section>
    <div id="naiyou-steps"></div>
    </main>
  </div>

  <a class="naiyou-hint-fab" id="hint-fab" href="../hint/">ヒント</a>
  <button class="naiyou-reset" id="reset-btn" type="button"></button>
  <div class="naiyou-clear" id="clear-overlay" hidden>
    <p id="clear-message">正解！</p>
  </div>
  <footer class="site-footer" id="site-footer"></footer>

  <script src="../data/site.js"></script>
  <script src="../data/naiyoubutsu.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      const data = NAIYOUBUTSU;
      const STORAGE_KEY = "naiyoubutsu-progress";

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function toHiragana(value) {
        return String(value).replace(/[\u30A1-\u30F6]/g, (ch) =>
          String.fromCharCode(ch.charCodeAt(0) - 0x60)
        );
      }

      function normalize(value) {
        return toHiragana(
          String(value)
            .normalize("NFKC")
            .toLowerCase()
            .replace(/[\s　]/g, "")
            .replace(/[ー―‐–—−〜~ｰ－-]/g, "ー")
            .replace(/[・･。．.、，,！!？?「」『』]/g, "")
        );
      }

      function variantsOf(value) {
        const base = normalize(value);
        const set = new Set([base, base.replace(/ー/g, "")]);
        set.add(base.replace(/づ/g, "ず").replace(/ぢ/g, "じ"));
        set.add(base.replace(/ず/g, "づ").replace(/じ/g, "ぢ"));
        return set;
      }

      function emptyProgress() {
        return { started: false, solved: 0, answers: [] };
      }

      function loadProgress() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY);
          if (!raw) return emptyProgress();
          const parsed = JSON.parse(raw);
          const solved = Math.max(0, Math.min(data.steps.length, Number(parsed.solved) || 0));
          const answers = Array.isArray(parsed.answers)
            ? parsed.answers.map((item) => String(item || ""))
            : [];
          return {
            started: Boolean(parsed.started),
            solved,
            answers,
          };
        } catch (err) {
          return emptyProgress();
        }
      }

      function saveProgress(progress) {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      }

      function isCorrect(step, value) {
        const accepted = new Set();
        (step.answers || []).forEach((answer) => {
          variantsOf(answer).forEach((item) => {
            if (item) accepted.add(item);
          });
        });
        if (!accepted.size) return false;
        return [...variantsOf(value)].some((item) => accepted.has(item));
      }

      function noticeHtml(notice) {
        if (!notice) return "";
        const lines = Array.isArray(notice) ? notice : [notice];
        const content = lines
          .filter((line) => String(line || "").trim())
          .map((line) => `<p>${escapeHtml(line)}</p>`)
          .join("");
        if (!content) return "";
        return `<div class="naiyou-notice">${content}</div>`;
      }

      function stepHtml(step, index, state, submitted) {
        const n = index + 1;
        const bar = `<h3 class="naiyou-step-bar">STEP${n}</h3>`;
        const locked = state === "done";
        const valueAttr = locked ? ` value="${escapeHtml(submitted || "")}"` : "";
        return `
          <section class="naiyou-step" data-step="${n}">
            ${bar}
            <p class="naiyou-open">${escapeHtml(step.open)}</p>
            ${noticeHtml(step.notice)}
            <p class="naiyou-q">${escapeHtml(step.question)}</p>
            ${noticeHtml(step.questionNotice)}
            <form class="naiyou-form${locked ? " is-locked" : ""}" data-index="${index}">
              <label class="visually-hidden" for="answer-${n}">答え</label>
              <input id="answer-${n}" name="answer" type="text" autocomplete="off" inputmode="text"${valueAttr}${locked ? " readonly tabindex=\"-1\"" : ""}>
              <button class="naiyou-btn" type="submit"${locked ? " disabled" : ""}>送信</button>
              ${locked ? "" : `<p class="naiyou-ng" hidden>${escapeHtml(data.wrongMessage)}</p>`}
            </form>
          </section>`;
      }

      function dismissKeyboard() {
        const active = document.activeElement;
        if (active && typeof active.blur === "function") active.blur();
        const inputs = document.querySelectorAll(".naiyou-form input");
        inputs.forEach((el) => el.blur());
        // フォーカスを外し、モバイルのキーボード閉じを待つ
        return new Promise((resolve) => {
          window.setTimeout(resolve, 280);
        });
      }

      function showClear() {
        const overlay = document.getElementById("clear-overlay");
        const message = document.getElementById("clear-message");
        if (message) message.textContent = data.correctMessage || "正解！";
        if (!overlay) return Promise.resolve();

        return dismissKeyboard().then(() => {
          overlay.hidden = false;
          overlay.classList.remove("is-on");
          void overlay.offsetWidth;
          overlay.classList.add("is-on");

          return new Promise((resolve) => {
            window.setTimeout(() => {
              overlay.classList.remove("is-on");
              window.setTimeout(() => {
                overlay.hidden = true;
                resolve();
              }, 280);
            }, 1180);
          });
        });
      }

      function resolveCompleteHref(link) {
        if (link.share === "tweet") {
          const intent = new URL("https://twitter.com/intent/tweet");
          intent.searchParams.set("text", link.tweetText || "");
          if (link.sharePath) {
            intent.searchParams.set(
              "url",
              new URL(link.sharePath, window.location.href).href
            );
          }
          return intent.toString();
        }
        return link.href || "#";
      }

      function completeHtml() {
        const title = escapeHtml(data.completeTitle || "COMPLETE!");
        const messages = Array.isArray(data.completeMessage)
          ? data.completeMessage
          : [data.completeMessage || ""];
        const body = messages
          .filter((para) => String(para || "").trim())
          .map((para) => `<p>${escapeHtml(para).replace(/\n/g, "<br>")}</p>`)
          .join("");
        const clearImage = data.completeClearImage
          ? `<p class="naiyou-complete-clear">
              <img src="${escapeHtml(data.completeClearImage)}" alt="ALL CLEAR" width="1200" height="630">
            </p>`
          : "";
        const links = (data.completeLinks || [])
          .map((link, i) => {
            const href = escapeHtml(resolveCompleteHref(link));
            const shareAttr = link.share === "tweet" ? ` data-complete-share="tweet" data-complete-index="${i}"` : "";
            return `
            <a class="naiyou-complete-link" href="${href}" target="_blank" rel="noopener noreferrer"${shareAttr}>
              <img src="${escapeHtml(link.image)}" alt="${escapeHtml(link.alt || "")}" width="1200" height="400">
            </a>`;
          })
          .join("");
        const credits = (data.completeCredits || [])
          .filter((line) => String(line || "").trim())
          .map((line) => `<p>${escapeHtml(line)}</p>`)
          .join("");
        const creditsHtml = credits
          ? `<div class="naiyou-complete-credits">${credits}</div>`
          : "";
        return `
          <section class="naiyou-complete" id="naiyou-complete" aria-labelledby="complete-title">
            <h2 id="complete-title" class="naiyou-complete-title">${title}</h2>
            <div class="naiyou-complete-body">${body}</div>
            ${clearImage}
            <div class="naiyou-complete-links">${links}</div>
            ${creditsHtml}
          </section>`;
      }

      function scrollToStepTarget(target) {
        if (!target) return;
        // 少し上に余白を残して、新しいSTEPが見やすい位置へ
        const offset = 24;
        const top = target.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }

      function renderSteps(solved, currentOpen, scrollToCurrent) {
        const mount = document.getElementById("naiyou-steps");
        const parts = [];
        const finished = solved >= data.steps.length;
        for (let i = 0; i < solved; i += 1) {
          parts.push(stepHtml(data.steps[i], i, "done", progress.answers[i]));
        }
        if (currentOpen && !finished) {
          parts.push(stepHtml(data.steps[solved], solved, "open"));
        }
        if (finished) {
          parts.push(completeHtml());
        }
        mount.innerHTML = parts.join("");
        if (!scrollToCurrent) return;
        window.requestAnimationFrame(() => {
          if (finished) {
            scrollToStepTarget(document.getElementById("naiyou-complete"));
            return;
          }
          if (currentOpen) {
            scrollToStepTarget(
              mount.querySelector(`.naiyou-step[data-step="${solved + 1}"]`)
            );
          }
        });
      }

      NAZONE.init();

      const title = data.title || "はじめに";
      document.getElementById("naiyou-title").textContent = title;
      const startImg = document.getElementById("naiyou-start-img");
      if (startImg) {
        startImg.alt = title;
        if (data.startImage) startImg.src = data.startImage;
      }
      const thanks = Array.isArray(data.thanks) ? data.thanks : [data.thanks || ""];
      document.getElementById("naiyou-thanks").innerHTML = thanks
        .filter((para) => String(para || "").trim())
        .map((para) => `<p>${escapeHtml(para).replace(/\n/g, "<br>")}</p>`)
        .join("");
      document.getElementById("notes-title").textContent = data.notesTitle || "注意事項";
      document.getElementById("naiyou-notes").innerHTML = (data.notes || [])
        .map((line) => `<li>${escapeHtml(line)}</li>`)
        .join("");

      const startBtn = document.getElementById("start-btn");
      startBtn.textContent = data.startLabel || "始める";
      const hintFab = document.getElementById("hint-fab");
      if (hintFab && data.hintLabel) hintFab.textContent = data.hintLabel;
      const resetBtn = document.getElementById("reset-btn");
      if (resetBtn) resetBtn.textContent = data.resetLabel || "最初に戻す（編集用）";

      const progress = loadProgress();

      function begin() {
        progress.started = true;
        saveProgress(progress);
        startBtn.classList.add("is-hidden");
        renderSteps(progress.solved, true);
      }

      function resetToStart() {
        if (!window.confirm(data.resetConfirm || "最初の状態に戻しますか？")) return;
        sessionStorage.removeItem(STORAGE_KEY);
        progress.started = false;
        progress.solved = 0;
        progress.answers = [];
        startBtn.classList.remove("is-hidden");
        document.getElementById("naiyou-steps").innerHTML = "";
        const overlay = document.getElementById("clear-overlay");
        if (overlay) {
          overlay.classList.remove("is-on");
          overlay.hidden = true;
        }
        window.scrollTo(0, 0);
      }

      if (progress.started) {
        begin();
      }

      startBtn.addEventListener("click", () => {
        if (progress.started) return;
        begin();
      });

      if (resetBtn) resetBtn.addEventListener("click", resetToStart);

      document.getElementById("naiyou-steps").addEventListener("submit", (e) => {
        const form = e.target.closest(".naiyou-form");
        if (!form) return;
        e.preventDefault();
        if (form.classList.contains("is-locked")) return;
        const index = Number(form.dataset.index);
        if (index !== progress.solved) return;
        const input = form.querySelector("input");
        const ng = form.querySelector(".naiyou-ng");
        const value = (input && input.value) || "";
        if (isCorrect(data.steps[index], value)) {
          progress.answers[index] = value;
          progress.solved += 1;
          saveProgress(progress);
          showClear().then(() => {
            renderSteps(progress.solved, true, true);
          });
        } else if (ng) {
          ng.hidden = false;
        }
      });

      document.getElementById("naiyou-steps").addEventListener("input", (e) => {
        const form = e.target.closest(".naiyou-form");
        if (!form) return;
        const ng = form.querySelector(".naiyou-ng");
        if (ng) ng.hidden = true;
      });

      document.getElementById("naiyou-steps").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-complete-share='tweet']");
        if (!btn) return;
        const index = Number(btn.dataset.completeIndex);
        const link = (data.completeLinks || [])[index];
        if (!link || link.share !== "tweet") return;
        e.preventDefault();

        // await のあとに open するとポップアップブロックされるため、同期で開く
        window.open(resolveCompleteHref(link), "_blank", "noopener,noreferrer");
      });
    })();
  </script>
</body>
</html>
