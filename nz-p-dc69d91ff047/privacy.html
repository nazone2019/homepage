  <script>
    (function () {
      const mount = document.getElementById("privacy-mount");
      if (!mount || typeof PRIVACY === "undefined") return;
      const p = PRIVACY;

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function nlToBr(value) {
        return escapeHtml(value).replace(/\n/g, "<br>");
      }

      mount.innerHTML =
        `<p class="mock-privacy__intro">${escapeHtml(p.intro)}</p>` +
        (p.sections || [])
          .map(
            (s) => `
        <section class="mock-privacy__block">
          <h2>${escapeHtml(s.title)}</h2>
          <p>${nlToBr(s.body)}</p>
        </section>`
          )
          .join("") +
        `<p class="mock-privacy__foot">お問い合わせは<a href="contact.html">こちら</a></p>`;
    })();
  </script>
