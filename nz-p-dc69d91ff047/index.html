<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全国の大学生が集まってできた謎解き制作集団 NAZONE（草案）">
  <meta name="robots" content="noindex, nofollow">
  <title>NAZONE（草案）</title>
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/mock.css?v=35">
</head>
<body class="draft-mock">
  <div class="mock-stage" id="mock-stage">
    <img
      class="mock-image"
      src="homepage_home2.webp"
      alt="NAZONE ホームページ草案"
      width="1920"
      height="7500"
      decoding="async"
      fetchpriority="high"
      draggable="false"
    >

    <!-- 完成図からそのまま切り出し（装飾込み） -->
    <div class="catch" aria-label="ココロざすを志す">
      <img
        class="catch__line catch__line--kana"
        src="assets/catch-kana.webp"
        alt="ココロざす"
        width="830"
        height="230"
        draggable="false"
      >
      <img
        class="catch__line catch__line--kanji"
        src="assets/catch-kanji.webp"
        alt="志す"
        width="441"
        height="227"
        draggable="false"
      >
    </div>

    <!-- 完成図の位置に固定（上下の細かい動きのみ） -->
    <p class="mock-scroll" aria-hidden="true">
      <img class="mock-scroll__img" src="assets/scroll-mark.webp" alt="" width="325" height="185" draggable="false">
    </p>

    <a class="hotspot hotspot--logo" href="index.html" aria-label="NAZONE トップ"></a>

    <!-- モバイルのみ：完成図の位置にハンバーガー -->
    <button class="mock-menu" id="menu-btn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="mock-nav">
      <img src="assets/menu-icon.webp" alt="" width="155" height="125" draggable="false">
      <span class="mock-menu__bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>

    <a class="hotspot hotspot--about-btn" href="about.html" aria-label="もっと詳しく！"></a>

    <button class="hotspot hotspot--works-prev" type="button" data-carousel="works" data-dir="-1" aria-label="公演 前へ"></button>
    <button class="hotspot hotspot--works-next" type="button" data-carousel="works" data-dir="1" aria-label="公演 次へ"></button>
    <div class="home-card-slot home-card-slot--works" id="works-card-slot"></div>
    <a class="hotspot hotspot--works-all" href="works.html" aria-label="公演をすべて表示する"></a>

    <button class="hotspot hotspot--goods-prev" type="button" data-carousel="goods" data-dir="-1" aria-label="グッズ 前へ"></button>
    <button class="hotspot hotspot--goods-next" type="button" data-carousel="goods" data-dir="1" aria-label="グッズ 次へ"></button>
    <div class="home-card-slot home-card-slot--goods" id="goods-card-slot"></div>
    <a class="hotspot hotspot--goods-all" href="goods.html" aria-label="グッズをすべて表示する"></a>
  </div>

  <!-- モバイル用ドロップダウン -->
  <nav class="mock-nav" id="mock-nav" hidden>
    <a href="index.html" aria-current="page"><span class="mock-nav__ja">ホーム</span><span class="mock-nav__en">Home</span></a>
    <a href="about.html"><span class="mock-nav__ja">NAZONEって？</span><span class="mock-nav__en">About</span></a>
    <a href="works.html"><span class="mock-nav__ja">制作した公演</span><span class="mock-nav__en">Works</span></a>
    <a href="goods.html"><span class="mock-nav__ja">制作したグッズ</span><span class="mock-nav__en">Goods</span></a>
    <a href="contact.html"><span class="mock-nav__ja">お問い合わせ</span><span class="mock-nav__en">Contact</span></a>
    <a href="../index.html"><span class="mock-nav__ja">現行サイトへ</span><span class="mock-nav__en">Live</span></a>
  </nav>

  <!-- PC用サイドメニュー（0001型） -->
  <nav class="mock-side-nav" aria-label="メインメニュー">
    <a href="index.html" aria-current="page">
      <span class="mock-side-nav__ja">ホーム</span>
      <span class="mock-side-nav__en is-home">Home</span>
    </a>
    <a href="about.html">
      <span class="mock-side-nav__ja">NAZONEって？</span>
      <span class="mock-side-nav__en is-about">About</span>
    </a>
    <a href="works.html">
      <span class="mock-side-nav__ja">制作した公演</span>
      <span class="mock-side-nav__en is-works">Works</span>
    </a>
    <a href="goods.html">
      <span class="mock-side-nav__ja">制作したグッズ</span>
      <span class="mock-side-nav__en is-goods">Goods</span>
    </a>
    <a href="contact.html">
      <span class="mock-side-nav__ja">お問い合わせ</span>
      <span class="mock-side-nav__en is-contact">Contact</span>
    </a>
  </nav>

  <script src="js/catalog.js"></script>
  <script src="js/cards.js?v=25"></script>
  <script src="js/mock-common.js?v=2"></script>
  <script src="js/mock.js?v=23"></script>
</body>
</html>
