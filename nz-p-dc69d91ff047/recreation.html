<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全国の大学生が集まってできた謎解き制作集団 NAZONE（草案・HTML再現）">
  <meta name="robots" content="noindex, nofollow">
  <title>NAZONE（草案・HTML再現）</title>
  <link rel="icon" href="../assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/draft.css">
</head>
<body class="draft-home">
  <div class="draft-stage">
    <header class="draft-header">
      <a class="draft-logo" href="./" aria-label="NAZONE">
        <svg class="draft-logo__mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 34V14l16-8 16 8v20l-16 8-16-8Z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M8 14l16 8 16-8M24 22v20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M28 10l8-3 4 7-7 4-5-8Z" fill="#4cbf82"/>
        </svg>
        <span>NAZONE</span>
      </a>
      <button class="draft-menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="draft-nav" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="draft-nav" id="draft-nav" hidden>
      <a href="#about">About</a>
      <a href="#works">Works</a>
      <a href="#goods">Goods</a>
      <a href="./">画像ベース版へ</a>
    </nav>

    <section class="draft-hero" aria-label="メインビジュアル">
      <div class="draft-hero__visual">
        <svg class="draft-hero__cube" viewBox="0 0 320 300" role="img" aria-label="NAZONE">
          <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round">
            <path d="M40 210V95l120-62 120 62v115l-120 62-120-62Z"/>
            <path d="M40 95l120 62 120-62"/>
            <path d="M160 157v115"/>
          </g>
          <path d="M188 72l42-18 22 38-38 22-26-42Z" fill="#4cbf82"/>
        </svg>
        <div class="draft-hero__catch">
          <span>ココロざす</span>
          <span>を</span>
          <span>志す</span>
        </div>
      </div>
      <p class="draft-scroll" aria-hidden="true">
        <span>SCROLL</span>
        <i></i>
      </p>
    </section>

    <main class="draft-panel">
      <section class="draft-section" id="about" aria-labelledby="about-title">
        <header class="draft-section__head">
          <h2 id="about-title">NAZONEって？</h2>
          <p>About</p>
        </header>
        <div class="draft-about-logo">
          <img src="../assets/brand/logo.webp" alt="NAZONE" width="2400" height="514">
        </div>
        <p class="draft-about-copy">
          全国の大学生が集まってできた謎解き制作集団、<br>
          2019年6月設立。<br>
          参加者自身が主人公になって物語体験を楽しめる<br>
          「体験型謎解きゲーム」と呼ばれるイベントを<br>
          制作・開催する。
        </p>
        <a class="draft-btn" href="../about.html">もっと詳しく！</a>
      </section>

      <hr class="draft-rule" aria-hidden="true">

      <section class="draft-section" id="works" aria-labelledby="works-title">
        <header class="draft-section__head">
          <h2 id="works-title">制作した公演</h2>
          <p>Works</p>
        </header>
        <div class="draft-carousel" data-carousel="works">
          <button class="draft-carousel__nav is-prev" type="button" aria-label="前へ"></button>
          <div class="draft-carousel__viewport">
            <ul class="draft-carousel__track" id="works-track"></ul>
          </div>
          <button class="draft-carousel__nav is-next" type="button" aria-label="次へ"></button>
        </div>
        <a class="draft-btn" href="../contents.html">すべて表示する</a>
      </section>

      <hr class="draft-rule" aria-hidden="true">

      <section class="draft-section" id="goods" aria-labelledby="goods-title">
        <header class="draft-section__head">
          <h2 id="goods-title">制作したグッズ</h2>
          <p>Goods</p>
        </header>
        <div class="draft-carousel" data-carousel="goods">
          <button class="draft-carousel__nav is-prev" type="button" aria-label="前へ"></button>
          <div class="draft-carousel__viewport">
            <ul class="draft-carousel__track" id="goods-track"></ul>
          </div>
          <button class="draft-carousel__nav is-next" type="button" aria-label="次へ"></button>
        </div>
        <a class="draft-btn" href="../goods.html">すべて表示する</a>
      </section>
    </main>

    <footer class="draft-footer">
      <p>© 2019 NAZONE. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/draft.js"></script>
</body>
</html>
