<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONEへのお問い合わせ">
  <title>CONTACT | NAZONE</title>
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="section-head">
      <p>Contact</p>
      <h1>お問い合わせ</h1>
    </div>
    <p class="contact-lead" id="contact-lead"></p>
    <form class="contact-form" id="contact-form">
      <div class="field">
        <label for="name">お名前 *</label>
        <input id="name" name="name" type="text" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">メールアドレス *</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="message">本文</label>
        <textarea id="message" name="message"></textarea>
      </div>
      <button class="btn-submit" type="submit">送信</button>
      <p class="form-note">送信するとメールアプリが開きます。<a href="privacy.html">プライバシーポリシー</a></p>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/contact.js"></script>
  <script src="js/main.js"></script>
  <script>
    NAZONE.init({ crumb: "CONTACT" });
    document.getElementById("contact-lead").textContent = CONTACT.lead;

    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      const subject = encodeURIComponent(`[NAZONE] お問い合わせ — ${name}`);
      const body = encodeURIComponent(
        `お名前: ${name}\nメール: ${email}\n\n${message}`
      );
      const to = CONTACT.email || "";
      if (!to) {
        alert("送信先メールアドレスが未設定です。data/contact.js の email を設定してください。");
        return;
      }
      location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
