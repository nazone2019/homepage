<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NAZONEへのお問い合わせ">
  <title>CONTACT | NAZONE</title>
  <link rel="icon" href="assets/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="wrap">
    <div class="section-head">
      <p>Contact</p>
      <h1>お問い合わせ</h1>
    </div>
    <p class="contact-lead" id="contact-lead"></p>
    <form class="contact-form" id="contact-form" method="post" action="">
      <div class="contact-honeypot" aria-hidden="true">
        <label for="wana">Leave blank</label>
        <input id="wana" name="wana" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="field">
        <label for="name">お名前 *</label>
        <input id="name" name="お名前" type="text" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">メールアドレス *</label>
        <input id="email" name="メールアドレス" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="message">本文 *</label>
        <textarea id="message" name="お問い合わせ内容" required></textarea>
      </div>
      <button class="btn-submit" type="submit">送信</button>
      <p class="form-note">送信内容は <span id="contact-email"></span> へ届きます。<a href="privacy.html">プライバシーポリシー</a></p>
    </form>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="data/site.js"></script>
  <script src="data/contact.js"></script>
  <script src="js/main.js"></script>
  <script>
    NAZONE.init({ crumb: "CONTACT" });
    document.getElementById("contact-lead").textContent = CONTACT.lead;
    const form = document.getElementById("contact-form");
    const emailNote = document.getElementById("contact-email");
    if (emailNote) emailNote.textContent = CONTACT.email || "";
    if (form && CONTACT.formAction) {
      form.action = CONTACT.formAction;
    }
  </script>
</body>
</html>
